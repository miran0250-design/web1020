<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>그라데이션 배경</title>
  <style>
    div{
      width: 500px;
      height: 500px;
      margin: 10px;
    }
    .gr1{
       background: linear-gradient(135deg, #ff8a1e 0%, #ffe2a6 100%);
    }
    .gr2{
       background: radial-gradient(circle at 50% 50%, color-mix(in oklch, #1ffffb 72%, transparent) 0%, color-mix(in oklch, #f1ffa8 72%, transparent) 100%);
    }
    .gr3{
       background-color: #fef3c7;
  background-image:
    radial-gradient(circle at 18% 22%, #ff8a1e 0 18%, transparent 42%),
    radial-gradient(circle at 78% 18%, #ffe2a6 0 16%, transparent 40%),
    radial-gradient(circle at 70% 82%, #22d3ee 0 18%, transparent 44%),
    linear-gradient(135deg, #fef3c7, #ff8a1e);
  background-image:
    radial-gradient(circle at 18% 22%, color-mix(in oklch, #ff8a1e 88%, transparent) 0 18%, transparent 42%),
    radial-gradient(circle at 78% 18%, color-mix(in oklch, #ffe2a6 88%, transparent) 0 16%, transparent 40%),
    radial-gradient(circle at 70% 82%, color-mix(in oklch, #22d3ee 88%, transparent) 0 18%, transparent 44%),
    linear-gradient(135deg, color-mix(in oklch, #fef3c7 88%, white), color-mix(in oklch, #ff8a1e 22%, #fef3c7));
  background-blend-mode: screen, lighten, overlay, normal;
    }
    .gr4{
       background-color: color-mix(in oklch, #feba95 68%, transparent);
  background-image:
    radial-gradient(circle at 50% 50%, color-mix(in oklch, #a8baff 68%, transparent) 0% 18%, transparent 34%),
    radial-gradient(circle at 82% 18%, color-mix(in oklch, color-mix(in oklch, #a8baff 68%, transparent) 48%, white) 0 16%, transparent 32%),
    radial-gradient(circle at 72% 76%, color-mix(in oklch, #feba95 68%, transparent) 0 18%, transparent 36%),
    radial-gradient(circle at 24% 82%, color-mix(in oklch, color-mix(in oklch, #feba95 68%, transparent) 55%, black) 0 16%, transparent 34%);
  background-blend-mode: screen, normal, multiply, normal;
    }
    .gr5{
      background: linear-gradient(
    132deg,
    color-mix(in oklch, color-mix(in oklch, #ffccfb 68%, transparent) 86%, white) 0%,
    color-mix(in oklch, #ffccfb 68%, transparent) 24%,
    color-mix(in oklch, color-mix(in oklch, #ffccfb 68%, transparent) 48%, color-mix(in oklch, #95fedb 68%, transparent)) 48%,
    color-mix(in oklch, #95fedb 68%, transparent) 72%,
    color-mix(in oklch, color-mix(in oklch, #95fedb 68%, transparent) 70%, black) 100%
  );
    }
    .gr6{
       background-color: color-mix(in oklch, #a9ffa3 68%, transparent);
  background-image:
    radial-gradient(ellipse at 12% 24%, color-mix(in oklch, color-mix(in oklch, #eeff00 68%, transparent) 84%, white) 0 16%, transparent 46%),
    radial-gradient(ellipse at 82% 28%, color-mix(in oklch, color-mix(in oklch, #a9ffa3 68%, transparent) 76%, white) 0 18%, transparent 48%),
    radial-gradient(ellipse at 52% 84%, color-mix(in oklch, color-mix(in oklch, #eeff00 68%, transparent) 52%, color-mix(in oklch, #a9ffa3 68%, transparent)) 0 22%, transparent 54%),
    radial-gradient(circle, rgba(255,255,255,.18) 0 1px, transparent 1px),
    linear-gradient(132deg, color-mix(in oklch, color-mix(in oklch, #a9ffa3 68%, transparent) 82%, black), color-mix(in oklch, color-mix(in oklch, #eeff00 68%, transparent) 18%, color-mix(in oklch, #a9ffa3 68%, transparent)));
  background-size: 100% 100%, 100% 100%, 100% 100%, 10px 10px, 100% 100%;
  background-blend-mode: screen, lighten, overlay, soft-light, normal;
    }
  </style>
</head>
<body>
  <div class="gr1"></div>
  <div class="gr2"></div>
  <div class="gr3"></div>
  <div class="gr4"></div>
  <div class="gr5"></div>
  <div class="gr6"></div>
</body>
</html>
