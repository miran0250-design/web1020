<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex_diraction</title>
  <link rel="stylesheet" href="dafault.css">
   <style>
    .flex_container{
      display: flex;
      flex-direction: row; /* 기본 값 ; 아이템 들이 가로 방향으로 배치 */
      flex-direction: column; /* 아이템들이 세로 방향으로 */
      flex-direction: row-reverse; /* 아이템들이 역순으로 가로 배치 */
      flex-direction: column-reverse;/* 아이템들이 역순으로 세로 배치 */
      gap: 10px;

    }
  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">aa</div>
    <div class="flex_item">bb</div>
    <div class="flex_item">cc</div>
  </div>

</body>

</html>
