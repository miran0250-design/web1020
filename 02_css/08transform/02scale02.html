<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>scale</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
    ul{
      list-style: none;
      width: 640px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
    }
    ul li{
      width: 200px;
      height: 150px;
      overflow: hidden;
    }
    ul li a{
      display: block;
      width: 100%;
      height: 100%;
    }
    ul li a img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: .6s;
    }
    ul li:hover a img{
      transform: scale(1.2);
    }
  </style>
</head>
<body>
  <ul>
    <li><a href="`#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmsPkcZuuNCq6D1IHI-SzaFAfs7C1g5IsjzqChurJfoQ&s=10" alt="지창욱"></a></li>
    <li><a href="`#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBWsKx9hkxQXC9Gvzp9wPsMbGO0fCiJWmjC4-YyPe7MA&s=10" alt="지창욱"></a></li>
    <li><a href="`#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRToBM59dTRjIqd7lnf9RMBeWgrhwOovFllceNo6tSgCQ&s=10" alt="지창욱"></a></li>
    <li><a href="`#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0NiGfkPm2Wg-u5RMBk5RA9SmHdgBc5KGBO5Fe2Af5fw&s=10" alt="지창욱"></a></li>
  </ul>
</body>
</html>
