<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드뒤집기</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
    .con{
      width: 300px;
      height: 300px;
      background: #ccc;
      position: relative;
      margin: 400px auto;
      perspective: 500px;
    }
    .con .card{
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      transition: .6s;
      transform-origin: top center;
      transform-style: preserve-3d;
    }
    .con:hover .card{
      transform: rotatex(180deg);
      
    }
    .face{
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      backface-visibility: hidden
    }
    .face img{
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .back{
       transform: rotateX(180deg);
    }
  </style>
</head>
<body>
  <div class="con">
    <div class="card">
      <div class="face front" ><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxdldqyo9yB7jKQri4c0O7vL4c1unLHCjvnuWXSyS86Pmj1_P4tLo1Jn1Y&s=10" alt="지창욱앞면"></div>
      <div class="face back"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSCawjpCSaZY57DiJnLMmjFOkl7jJj46NqGY4QKVK_WwA&s=10" alt="지창욱뒷면"></div>

    </div><!-- //card -->
  </div><!-- //con -->
</body>
</html>
