<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>input 태그 속성</title>
  <style>
    em{
      color: red;
    }
  </style>
</head>
<body>
  <form>
    <ul>
      <li>
        <!-- placeholder : 입력란에 표시하는 힌트로 필드를 클릭하면 사라짐 -->
        <label for="uid">이름</label>
        <input type="text" id="uid" autofocus></li>
      <li>
        <!-- placeholder : 입력란에 표시하는 힌트로 필드를 클릭하면 사라짐 -->
        <label for="pw">학번</label>
        <input type="number" id="pw" placeholder="하이픈 없이 입력"></li>
      <li>
        <!-- readonly : 내용을 보기만 하고 입력하지 못하게 함.-->
        <label for="none">읽기만함</label>
        <input type="text" id="none" value="못쳐요" readonly></li>
      <li>
         <!-- required : 필수 필드 체크 -->
        <label for="name"><em>*</em>닉네임</label>
        <input type="text" id="name" required>
      </li>
      <li>
        <input type="submit" value="전송">
      </li>
    </ul>
  </form>
  
</body>
</html>
