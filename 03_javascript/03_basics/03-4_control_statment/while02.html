<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    //변수 i -> 1~100

    let sum = 0;
    let i = 1;
    while(i<=100){
     sum+=i;
     i++
    }
    document.write(sum);
  </script>
</body>
</html>
