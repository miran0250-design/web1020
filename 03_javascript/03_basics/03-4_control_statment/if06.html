<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test</title>
</head>
<body>
  <div id="result"></div>
  <script>
    /*
      국어, 영어, 수학 점수를 prompt로 받아와서
      토탈
      평균
      학점

      평균이 90점 이상이면 A
      80점 이상이면 B
      70점 이상이면 C
      60점 이상이면 D
      그외는 F
      "당신의 학점은      입니다"
    */

    let kor = Number(prompt('국어 점수를 입력하세요'));
    let eng = Number(prompt('영어 점수를 입력하세요'));
    let math = Number(prompt('수학 점수를 입력하세요'));

    let all = (kor+eng+math);
    let av = (all/3);
    let score;

    if(av>=90){
      score= 'A'
    }else if(av>=80){
       score= 'B'
    }else if(av>=70){
       score= 'C'
    }else if(av>=60){
       score= 'D'
    }else {
      score = 'F'
    }
    let displayArea = document.querySelector('#result')
    displayArea.innerHTML = `당신의 학점은 ${score} 입니다`

   

  </script>
</body>
</html>
