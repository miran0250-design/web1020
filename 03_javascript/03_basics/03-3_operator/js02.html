<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나미지 연산</title>
</head>
<body>
  <script>
    let even0dd = prompt('숫자를 입력하세요');
    even0dd = Number(even0dd);
    let commet;
    if(even0dd % 2 === 0){
      commet = even0dd + '는(은) 짝수 입니다';
    }else{
      commet = even0dd + '는(은) 홀수 입니다';
    }
    document.write(commet);
  </script>
</body>
</html>
